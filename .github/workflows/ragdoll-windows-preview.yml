name: MMD Ragdoll - Windows NeoForge preview

on:
  push:
    branches:
      - ragdoll-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-neoforge:
    runs-on: windows-latest
    steps:
      - name: Checkout MmdSkin with Bullet3
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and verify Windows NeoForge preview
        shell: pwsh
        run: .\build-ragdoll-windows.ps1

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: mmdskin-ragdoll-neoforge-1.21.1-windows-x64
          path: |
            neoforge/build/libs/mmdskin-neoforge-*.jar
            !neoforge/build/libs/*-dev*.jar
            !neoforge/build/libs/*-sources*.jar
          if-no-files-found: error
